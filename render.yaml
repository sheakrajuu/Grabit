services:
  - type: web
    name: grabit
    runtime: node
    buildCommand: npm install && python3 -m pip install --disable-pip-version-check -r requirements.txt
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_VERSION
        value: 22
