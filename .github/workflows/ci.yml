on:
  push:
  pull_request:
  schedule:
    - cron: '*/7 * * * *'
  workflow_dispatch:
    inputs:
      health_url:
        description: Optional deployed Grabit base URL for a health check
        required: false
        type: string

jobs:
  tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  scheduled-health:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Keep the Grabit endpoint active
        env:
          HEALTH_URL: ${{ vars.GRABIT_HEALTH_URL || 'https://grabit-4xph.onrender.com' }}
        run: curl --fail --show-error --silent --retry 1 --retry-delay 5 --retry-all-errors --connect-timeout 20 --max-time 120 --write-out "\nHealth check returned HTTP %{http_code} after %{time_total}s\n" "${HEALTH_URL%/}/api/health"

  deployed-health:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed Grabit health endpoint
        env:
          HEALTH_URL: ${{ inputs.health_url || vars.GRABIT_HEALTH_URL || 'https://grabit-4xph.onrender.com' }}
        run: curl --fail --show-error --silent --max-time 20 "${HEALTH_URL%/}/api/health"
